<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testboekproces - FEC Sevenum</title>
<style>
  :root {
    --accent: #1b6f5c;
    --bg: #f7f7f5;
    --text: #1f1f1f;
    --border: #ddd;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 560px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; margin-bottom: 24px; }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; margin-top: 12px; margin-bottom: 4px; font-size: 0.9rem; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .slots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .slot {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.9rem;
    background: white;
  }
  .slot.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .slot.vol { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
  #resultaat {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
  }
  #resultaat.ok { background: #e5f4ee; border: 1px solid #9fd3bf; }
  #resultaat.fout { background: #fbeaea; border: 1px solid #e5a9a9; }
  .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Testboekproces</h1>
  <p class="subtitle">Los prototype dat rechtstreeks tegen de Recras API praat &mdash; los van de standaard Recras-widget.</p>

  <fieldset>
    <legend>1. Activiteit en datum</legend>
    <label for="product">Activiteit</label>
    <select id="product"></select>

    <label for="datum">Datum</label>
    <input type="date" id="datum" />

    <button id="zoekBtn" type="button">Zoek beschikbare tijden</button>

    <div class="slots" id="slots"></div>
    <p class="hint" id="slotsHint"></p>
  </fieldset>

  <fieldset>
    <legend>2. Gegevens</legend>
    <label for="voornaam">Voornaam</label>
    <input type="text" id="voornaam" />

    <label for="achternaam">Achternaam</label>
    <input type="text" id="achternaam" />

    <label for="email">E-mailadres</label>
    <input type="email" id="email" />

    <label for="telefoon">Telefoonnummer (optioneel)</label>
    <input type="tel" id="telefoon" />

    <label for="aantal">Aantal personen</label>
    <input type="number" id="aantal" min="1" value="1" />
  </fieldset>

  <button id="boekBtn" type="button" disabled>Boeking bevestigen</button>

  <div id="resultaat" style="display:none;"></div>

<script>
  const productSelect = document.getElementById('product');
  const datumInput = document.getElementById('datum');
  const zoekBtn = document.getElementById('zoekBtn');
  const slotsEl = document.getElementById('slots');
  const slotsHint = document.getElementById('slotsHint');
  const boekBtn = document.getElementById('boekBtn');
  const resultaatEl = document.getElementById('resultaat');

  let gekozenSlot = null; // ISO-string van het gekozen startmoment

  // Vandaag als standaarddatum
  datumInput.valueAsDate = new Date();

  async function laadProducten() {
    const res = await fetch('/api/producten');
    const producten = await res.json();
    productSelect.innerHTML = producten
      .map((p) => `<option value="${p.slug}">${p.naam} (${p.duur_minuten} min)</option>`)
      .join('');
  }

  function isoDatum(d) {
    return d.toISOString().slice(0, 10);
  }

  async function zoekBeschikbaarheid() {
    gekozenSlot = null;
    boekBtn.disabled = true;
    slotsEl.innerHTML = '';
    slotsHint.textContent = 'Bezig met laden...';

    const slug = productSelect.value;
    const begin = datumInput.value; // gekozen dag zelf, exclusief in de API
    const eindDatum = new Date(datumInput.value);
    eindDatum.setDate(eindDatum.getDate() + 1);
    const eind = isoDatum(eindDatum); // dag erna, zodat de gekozen dag wordt meegenomen

    try {
      const res = await fetch(
        `/api/beschikbaarheid/${slug}?begin=${begin}&eind=${eind}`
      );
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Onbekende fout');

      if (!data.length) {
        slotsHint.textContent = 'Geen startmomenten gevonden op deze dag.';
        return;
      }

      slotsHint.textContent = 'Kies een tijd:';
      data.forEach((moment) => {
        const tijd = new Date(moment.startmoment).toLocaleTimeString('nl-NL', {
          hour: '2-digit',
          minute: '2-digit',
        });
        // Pak de eerste locatie (of null-locatie) als representatieve capaciteit
        const beschikbaarheid = moment.locaties[0]?.beschikbaarheid ?? 0;
        const vol = beschikbaarheid <= 0;

        const el = document.createElement('div');
        el.className = 'slot' + (vol ? ' vol' : '');
        el.textContent = vol ? `${tijd} (vol)` : `${tijd} (${beschikbaarheid} vrij)`;
        if (!vol) {
          el.addEventListener('click', () => {
            document.querySelectorAll('.slot').forEach((s) => s.classList.remove('selected'));
            el.classList.add('selected');
            gekozenSlot = moment.startmoment;
            boekBtn.disabled = false;
          });
        }
        slotsEl.appendChild(el);
      });
    } catch (err) {
      slotsHint.textContent = 'Fout bij ophalen: ' + err.message;
    }
  }

  async function boekAf() {
    resultaatEl.style.display = 'none';
    boekBtn.disabled = true;

    const payload = {
      slug: productSelect.value,
      begin: gekozenSlot,
      aantal: parseInt(document.getElementById('aantal').value, 10),
      klant: {
        voornaam: document.getElementById('voornaam').value,
        achternaam: document.getElementById('achternaam').value,
        email: document.getElementById('email').value,
        telefoon: document.getElementById('telefoon').value,
      },
    };

    try {
      const res = await fetch('/api/boeking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Onbekende fout');

      resultaatEl.className = 'ok';
      resultaatEl.innerHTML = `
        <strong>Boeking gelukt!</strong><br />
        Boekingsnummer: ${data.boeking.id}<br />
        Klant: ${data.klant.displaynaam || data.klant.naam} (${data.nieuweKlant ? 'nieuw aangemaakt' : 'bestaande klant hergebruikt'})
      `;
    } catch (err) {
      resultaatEl.className = 'fout';
      resultaatEl.textContent = 'Boeking mislukt: ' + err.message;
    } finally {
      resultaatEl.style.display = 'block';
      boekBtn.disabled = false;
    }
  }

  zoekBtn.addEventListener('click', zoekBeschikbaarheid);
  boekBtn.addEventListener('click', boekAf);

  laadProducten();
</script>
</body>
</html>
